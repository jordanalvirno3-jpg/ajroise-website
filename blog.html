<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blog | SEO, Google Ads, Web Design & Marketing Guides | AJ ROIse</title>
<meta name="description" content="Read the latest SEO, GEO, Google Ads, Web Design and Digital Marketing guides for South African businesses. Expert tips from AJ ROIse Digital.">
<link rel="canonical" href="https://ajroise.co.za/blog.html">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --emerald:#16A34A; --emerald-dark:#15803D; --emerald-light:#22C55E; --charcoal:#111827; --bg:#FFFFFF; 
  --text:#111827; --muted:#6B7280; --border:#E5E7EB; --card:#F9FAFB;
}
[data-theme="dark"]{
  --emerald:#22C55E; --emerald-dark:#16A34A; --emerald-light:#4ADE80; --charcoal:#F9FAFB; --bg:#0B0F19; 
  --text:#F9FAFB; --muted:#9CA3AF; --border:#1F2937; --card:#111827;
}
*{margin:0;padding:0;box-sizing:border-box}
html, body{overflow-x:hidden;max-width:100%;scroll-behavior:smooth}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-top:92px;transition:background.3s,color.3s}
header{position:fixed;top:0;left:0;width:100%;z-index:100;background:rgba(255,255,255,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);transition:all.3s}
[data-theme="dark"] header{background:rgba(11,15,25,0.85)}
.nav{max-width:1400px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-family:Poppins;font-size:24px;font-weight:800;color:var(--charcoal);text-decoration:none;letter-spacing:-0.5px;white-space:nowrap;flex-shrink:0}
.logo span{color:var(--emerald)}
.nav-center{display:flex;gap:8px;align-items:center;background:var(--card);padding:6px;border-radius:16px;border:1px solid var(--border)}
.nav-link{color:var(--muted);text-decoration:none;font-weight:600;font-size:15px;padding:10px 18px;border-radius:12px;transition:all.3s;white-space:nowrap}
.nav-link:hover{color:var(--text);background:var(--bg)}
.nav-link.active{color:#fff;background:var(--emerald);box-shadow:0 4px 12px rgba(22,163,74,0.25)}
.nav-right{display:flex;gap:12px;align-items:center;flex-shrink:0}
.btn-quote{background:linear-gradient(135deg, var(--emerald), var(--emerald-light));color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;text-decoration:none;box-shadow:0 4px 14px rgba(22,163,74,0.25);transition:all.3s;font-size:14px;white-space:nowrap}
.theme-toggle{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:18px;transition:all.2s;flex-shrink:0}
.menu-btn{font-size:24px;background:none;border:none;color:var(--text);cursor:pointer;display:none;flex-shrink:0}
.mobile-menu{position:fixed;top:90px;right:20px;width:260px;background:var(--card);border:1px solid var(--border);border-radius:16px;z-index:200;transition:all.3s ease;box-shadow:0 10px 40px rgba(0,0,0,0.15);padding:20px;opacity:0;visibility:hidden;transform:translateY(-10px);display:flex;flex-direction:column;gap:8px}
.mobile-menu.active{opacity:1;visibility:visible;transform:translateY(0)}
.mobile-menu a{padding:12px 16px;border-radius:12px;color:var(--text);text-decoration:none;font-weight:600;transition:all.2s}
.mobile-menu a:hover{background:var(--bg)}
.mobile-menu-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:199;display:none;backdrop-filter:blur(2px)}
.mobile-menu-overlay.active{display:block}
.container{max-width:1400px;margin:0 auto;padding:60px 40px}
.page-header{text-align:center;margin-bottom:48px}
.page-title{font-family:Poppins;font-size:48px;font-weight:800;color:var(--text);margin-bottom:16px;letter-spacing:-1px}
.page-subtitle{font-size:18px;color:var(--muted);max-width:600px;margin:0 auto}
.filters{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:56px}
.filter-btn{padding:12px 24px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:12px;font-weight:600;cursor:pointer;transition:all.2s;font-size:15px}
.filter-btn.active,.filter-btn:hover{background:var(--emerald);color:#fff;border-color:var(--emerald);transform:translateY(-2px)}
.blog-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:32px}
.blog-card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:transform.3s,box-shadow.3s;display:flex;flex-direction:column}
.blog-card:hover{transform:translateY(-8px);box-shadow:0 15px 35px rgba(0,0,0,0.1)}
.blog-img{width:100%;height:240px;background:var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;font-weight:600;overflow:hidden}
.blog-img img{width:100%;height:100%;object-fit:cover;transition:transform.4s}
.blog-card:hover .blog-img img{transform:scale(1.05)}
.blog-content{padding:28px;flex-grow:1;display:flex;flex-direction:column}
.category-tag{background:var(--emerald);color:#fff;font-size:12px;font-weight:700;padding:7px 14px;border-radius:8px;display:inline-block;margin-bottom:16px;width:fit-content}
.blog-content h3{font-family:Poppins;font-size:21px;margin-bottom:14px;line-height:1.4;color:var(--text)}
.blog-content p{color:var(--muted);font-size:15px;margin-bottom:24px;flex-grow:1;line-height:1.7}
.btn-read{background:var(--emerald);color:#fff;padding:12px 20px;border-radius:10px;font-weight:700;text-decoration:none;display:inline-block;width:fit-content;transition:all.2s}
.btn-read:hover{background:var(--emerald-dark);transform:translateX(3px)}
.blog-card.hidden{display:none}
footer{border-top:1px solid var(--border);padding:50px 24px;text-align:center;color:var(--muted);font-size:14px;margin-top:80px}
@media(max-width:1024px){
 .blog-grid{grid-template-columns:repeat(2, 1fr)}
 .container{padding:40px 24px}
 .nav{padding:16px 20px}
}
@media(max-width:768px){
 .nav-center{display:none}
 .menu-btn{display:block}
 body{padding-top:110px}
 .page-title{font-size:34px}
 .blog-grid{grid-template-columns:1fr}
 .container{padding:32px 20px}
}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a href="/" class="logo">AJ <span>ROIse</span></a>
    
    <!-- DESKTOP NAV -->
    <div class="nav-center">
      <a href="/" class="nav-link">Home</a>
      <a href="/#services" class="nav-link">Services</a>
      <a href="/blog.html" class="nav-link active">Blog</a>
      <a href="/#contact" class="nav-link">Contact</a>
    </div>
    
    <div class="nav-right">
      <a href="/#contact" class="btn-quote">Get Free Quote</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<div class="mobile-menu-overlay" id="menuOverlay"></div>

<!-- MOBILE MENU - FIXED ANCHORS -->
<div class="mobile-menu" id="mobileMenu">
  <a href="/">Home</a>
  <a href="/#services">Services</a>
  <a href="/blog.html">Blog</a>
  <a href="/#contact">Contact</a>
</div>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">Marketing Insights & Guides</h1>
    <p class="page-subtitle">Expert strategies on SEO, GEO, Google Ads, and Web Design to grow South African businesses in 2026</p>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">All Posts</button>
    <button class="filter-btn" data-filter="seo">SEO & GEO</button>
    <button class="filter-btn" data-filter="ads">Google Ads & PPC</button>
    <button class="filter-btn" data-filter="ecom">E-commerce</button>
    <button class="filter-btn" data-filter="web">Web Design & CRO</button>
    <button class="filter-btn" data-filter="social">Social & Content</button>
    <button class="filter-btn" data-filter="case">Case Studies</button>
  </div>

  <div class="blog-grid" id="blogGrid"></div>
</div>

<footer>
  © 2026 AJ ROIse Digital. Professional SEO + GEO Services for South African Businesses.
</footer>

<script>
// THEME TOGGLE
const toggle = document.getElementById('themeToggle');
const html = document.documentElement;
const savedTheme = localStorage.getItem('theme') || 'light';
html.setAttribute('data-theme', savedTheme);
toggle.textContent = savedTheme === 'dark'? '☀️' : '🌙';
toggle.addEventListener('click', () => {
  const newTheme = html.getAttribute('data-theme') === 'dark'? 'light' : 'dark';
  html.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  toggle.textContent = newTheme === 'dark'? '☀️' : '🌙';
});

// MOBILE MENU
const menuBtn = document.getElementById('menuBtn');
const mobileMenu = document.getElementById('mobileMenu');
const menuOverlay = document.getElementById('menuOverlay');
menuBtn.addEventListener('click', () => {
  mobileMenu.classList.toggle('active');
  menuOverlay.classList.toggle('active');
});
menuOverlay.addEventListener('click', () => {
  mobileMenu.classList.remove('active');
  menuOverlay.classList.remove('active');
});

// CLOSE MENU WHEN LINK CLICKED
document.querySelectorAll('.mobile-menu a').forEach(link => {
  link.addEventListener('click', () => {
    mobileMenu.classList.remove('active');
    menuOverlay.classList.remove('active');
  });
});

// LOAD POSTS
async function loadPosts() {
  try {
    const res = await fetch('/posts.json?v=1');
    const posts = await res.json();
    const blogGrid = document.getElementById('blogGrid');
    
    blogGrid.innerHTML = posts.map(post => `
      <div class="blog-card" data-category="${post.category}">
        <div class="blog-img">
          <img src="${post.img}" alt="${post.title}" loading="lazy">
        </div>
        <div class="blog-content">
          <span class="category-tag">${post.categoryName}</span>
          <h3>${post.title}</h3>
          <p>${post.desc}</p>
          <a href="${post.link}" class="btn-read">Read More →</a>
        </div>
      </div>
    `).join('');
    
    setupFilters();
  } catch (err) {
    console.error('Error loading posts:', err);
  }
}

// FILTER
function setupFilters() {
  const filterBtns = document.querySelectorAll('.filter-btn');
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filter = btn.getAttribute('data-filter');
      document.querySelectorAll('.blog-card').forEach(card => {
        if(filter === 'all' || card.getAttribute('data-category') === filter){
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    });
  });
}

loadPosts();
</script>

</body>
</html>
